name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      # Retrieval-quality regression gate: the deterministic eval suite
      # (src/eval.rs, no API keys needed) must pass on every change.
      - name: Memory-quality eval gate
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --quiet -- eval --out target/eval-reports

      - name: Seven-budget benchmark smoke tests (no model calls)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/run_memory_density.py --suite longmemeval --data tests/fixtures/density/longmemeval.json --out "${{ runner.temp }}/density-lme"
          python3 scripts/run_memory_density.py --suite locomo --data tests/fixtures/density/locomo.json --out "${{ runner.temp }}/density-locomo"

      - name: Clippy
        run: cargo clippy -- -D warnings

  postgres-foundations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ironmem_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: postgres-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: PostgreSQL storage and checkpoint integration
        env:
          IRONMEM_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/ironmem_test
        run: cargo test --bin ironmem postgres_foundations -- --ignored
