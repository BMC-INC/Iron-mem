name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release version
        shell: bash
        run: |
          python -c 'import os,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["package"]["version"]; ref=os.environ["GITHUB_REF"]; assert not ref.startswith("refs/tags/") or ref == "refs/tags/v"+v, "tag/package version mismatch"'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          bin="target/${{ matrix.target }}/release/ironmem"
          test -x "$bin"
          mkdir -p dist
          cp "$bin" README.md LICENSE dist/
          tar czf "$GITHUB_WORKSPACE/ironmem-${{ matrix.target }}.tar.gz" -C dist ironmem README.md LICENSE

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/ironmem.exe"
          if (-not (Test-Path $binary)) { throw "missing $binary" }
          Compress-Archive -Path $binary,README.md,LICENSE -DestinationPath "ironmem-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironmem-${{ matrix.target }}
          path: ironmem-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage archives and checksums
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cd dist
          sha256sum -- * | tee SHA256SUMS
          test -f ironmem-x86_64-unknown-linux-gnu.tar.gz
          test -f ironmem-x86_64-apple-darwin.tar.gz
          test -f ironmem-aarch64-apple-darwin.tar.gz
          test -f ironmem-x86_64-pc-windows-msvc.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*
